# Carrega variaveis locais de .env (opcional, nao versionado).
# Em producao use as variaveis de ambiente do Render.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Obrigatorio ter pelo menos 32 caracteres (validado em JwtService)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${PORT:8080}

# Origens liberadas no CORS (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:5500,http://localhost:5173}

# Usuario ADMIN inicial criado na subida da aplicacao (deixe vazio para desabilitar)
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
