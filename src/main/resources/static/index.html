<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management</title>
  <meta name="description" content="Gerencie o acervo e os empréstimos da biblioteca.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <main id="auth-screen" class="auth-screen">
    <section class="auth-card">
      <div class="brand brand-lg">
        <span class="brand-icon">📚</span>
        <span class="brand-name">Library<b>Management</b></span>
      </div>
      <p class="muted auth-lead">Gerencie o acervo e os empréstimos da biblioteca.</p>

      <div class="tabs" role="tablist">
        <button class="tab is-active" data-auth-tab="login" role="tab">Entrar</button>
        <button class="tab" data-auth-tab="register" role="tab">Criar conta</button>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="login-email" placeholder="voce@email.com" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="login-password" placeholder="Sua senha" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>

      <form id="register-form" class="auth-form is-hidden" novalidate>
        <label class="field">
          <span>Nome</span>
          <input type="text" id="register-name" placeholder="Seu nome" autocomplete="name" required>
        </label>
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="register-email" placeholder="voce@email.com" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="register-password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
          <span>Confirmar senha</span>
          <input type="password" id="register-confirm" placeholder="Repita a senha" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
      </form>

      <p class="auth-hint">O primeiro ADMIN é criado no servidor via <code>ADMIN_EMAIL</code> e <code>ADMIN_PASSWORD</code>.</p>
    </section>
    <p class="auth-footer">Spring Boot · Spring Security · JWT</p>
  </main>

  <div id="app-screen" class="app is-hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">📚</span>
        <span class="brand-name">Library<b>Management</b></span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="dashboard"><span class="nav-ico">📊</span>Visão geral</button>
        <button class="nav-item" data-view="books"><span class="nav-ico">📚</span>Livros</button>
        <button class="nav-item" data-view="loans"><span class="nav-ico">🔁</span>Empréstimos</button>
        <button class="nav-item is-admin-only" data-view="users"><span class="nav-ico">👥</span>Usuários</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-box">
          <span class="avatar" id="user-avatar">?</span>
          <div class="user-meta">
            <strong id="user-name">—</strong>
            <span id="user-role" class="role-badge">—</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="logout-btn">Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Abrir menu">☰</button>
        <div class="topbar-title">
          <h1 id="view-title">Visão geral</h1>
          <p class="muted" id="view-subtitle">Resumo do acervo e dos empréstimos</p>
        </div>
        <span class="pill" id="topbar-role"></span>
      </header>
      <section class="view" id="view-root"></section>
    </div>
    <div class="scrim" id="scrim"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
